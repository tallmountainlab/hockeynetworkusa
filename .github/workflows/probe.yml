name: Probe video feeds
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p samples
          curl -sSL "https://www.youtube.com/feeds/videos.xml?channel_id=UCqFMzb-4AUf6WAIbl132QKA" -o samples/yt-channel.xml || true
          curl -sSL "https://www.youtube.com/feeds/videos.xml?user=NHLVideo" -o samples/yt-user.xml || true
          curl -sSL -A "Mozilla/5.0" "https://www.youtube.com/@NHL" -o samples/yt-nhl-page.html || true
          curl -sSL -A "Mozilla/5.0" "https://www.youtube.com/@utahmammoth" -o samples/yt-uta-page.html || true
          curl -sSL "https://forge-dapi.d3.nhle.com/v2/content/en-us/videos?tags.slug=utah-mammoth&context.slug=nhl&\$limit=5" -o samples/forge-videos.json || true
          curl -sSL "https://api-web.nhle.com/v1/gamecenter/2026020236/landing" -o samples/landing-uta.json || true
          ls -la samples
          git config user.name "probe-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B video-samples
          git add samples
          git commit -m "video samples"
          git push -f origin video-samples
