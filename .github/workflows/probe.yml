name: Probe NHL data
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p samples
          A=https://api-web.nhle.com/v1
          curl -sSL "$A/score/2026-11-03" -o samples/score.json
          curl -sSL "$A/standings/now" -o samples/standings.json
          curl -sSL "$A/schedule/now" -o samples/schedule-week.json
          G=$(python3 -c "import json;d=json.load(open('samples/score.json'));print(d['games'][0]['id'])")
          curl -sSL "$A/gamecenter/$G/landing" -o samples/landing.json
          curl -sSL "$A/club-schedule-season/BOS/20262027" -o samples/bos-schedule.json
          curl -sSL "https://api.nhle.com/stats/rest/en/team" -o samples/teams.json
          ls -la samples
          git config user.name "probe-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B nhl-samples
          git add samples
          git commit -m "NHL API samples"
          git push -f origin nhl-samples
